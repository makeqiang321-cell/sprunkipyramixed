<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Logo Generator</title>
<style>
body{margin:40px;background:#1a1a2e;color:#fff;font-family:Rajdhani,sans-serif}
h2{margin:20px 0 8px;color:#05b4d3}
img{border-radius:4px}
.logo-box{display:inline-block;margin:10px;padding:10px;background:#111;border-radius:8px;text-align:center}
.favicon{width:64px;height:64px;border-radius:12px;object-fit:cover}
.header-logo{height:32px;object-fit:cover;border-radius:6px}
.og-img{width:600px;max-width:100%;border-radius:8px}
button{display:block;margin:12px 0;padding:8px 20px;background:#05b4d3;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:Rajdhani;font-size:1rem}
</style></head><body>
<h1>🖼 Sprunki Pyramixed Logo Generator</h1>
<p>截图保存或用右键另存为</p>

<h2>🔖 Favicon (64×64)</h2>
<div class="logo-box"><img class="favicon" src="assets/sprunki-pyramixed.png" alt="Favicon"><br>浏览器标签页图标</div>

<h2>🏠 Header Logo (140×32)</h2>
<div class="logo-box"><img class="header-logo" src="assets/sprunki-pyramixed.png" alt="Header Logo" style="width:140px;height:32px"><br>导航栏Logo</div>

<h2>📢 og:image (1200×630)</h2>
<div class="logo-box"><img class="og-img" src="assets/sprunki-pyramixed.png" alt="OG Image"><br>Google/Facebook分享图</div>

<h2>📐 快速参考</h2>
<table border="1" cellpadding="8" style="border-collapse:collapse">
<tr><th>Logo</th><th>尺寸</th><th>用途</th></tr>
<tr><td>Favicon</td><td>64×64px</td><td>浏览器标签、书签</td></tr>
<tr><td>Header Logo</td><td>140×32px</td><td>网站导航栏</td></tr>
<tr><td>og:image</td><td>1200×630px</td><td>Google收录、社交分享</td></tr>
</table>
</body></html>
